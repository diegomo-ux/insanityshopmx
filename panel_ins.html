<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --asfalto: #111111;
  --carbon: #191919;
  --linea: #2b2b2b;
  --humo: #8f8f8f;
  --blanco: #ffffff;
  --hueso: #ECE7DD;
  --olivo: #A3AE8C;
  --naranja: #E0A04A;
  --alerta: #D9534F;
  --f-display: "Anton", "Oswald", Impact, "Arial Narrow", sans-serif;
  --f-texto: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-codigo: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--asfalto); color: var(--blanco); font-family: var(--f-texto); -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input { font: inherit; border-radius: 0; }
:focus-visible { outline: 1px solid var(--hueso); outline-offset: 2px; }
.mono { font-family: var(--f-codigo); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.muted { color: var(--humo); }

/* ---------- barra de arriba ---------- */
.top { position: sticky; top: 0; z-index: 5; background: rgba(17,17,17,.95); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--linea); padding: 12px 16px 10px; }
.barra { display: flex; align-items: center; gap: 12px; max-width: 1200px; margin: 0 auto; }
.barra h1 { font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1; margin: 2px 0 0; text-transform: uppercase; letter-spacing: .02em; }
.hoy { margin-left: auto; text-align: right; font-family: var(--f-codigo); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--humo); line-height: 1.35; }
.hoy b { display: block; font-size: 15px; letter-spacing: 0; color: var(--hueso); text-transform: none; }
.icono { flex: none; width: 42px; height: 42px; border: 1px solid var(--linea); display: grid; place-items: center; font-size: 18px; }
.icono.gira span { display: inline-block; animation: gira .8s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.filtros { max-width: 1200px; margin: 0 auto; }
.buscar { margin-top: 10px; width: 100%; height: 46px; padding: 0 14px; background: var(--carbon); border: 1px solid var(--linea); color: var(--blanco); font-size: 16px; }
.buscar::placeholder { color: var(--humo); }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 10px -16px 0; padding: 0 16px 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 12px; border: 1px solid var(--linea); font-family: var(--f-codigo); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--humo); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--hueso); border-color: var(--hueso); color: #0d0d0d; font-weight: 600; }

/* ---------- tarjetas ---------- */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 12px 16px 120px; max-width: 1200px; margin: 0 auto; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 860px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 1140px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.card { display: flex; flex-direction: column; text-align: left; background: var(--carbon); border: 1px solid var(--linea); transition: transform .12s, border-color .2s; min-width: 0; }
.card:active { transform: scale(.97); }
.card:hover { border-color: #444; }
.foto { position: relative; aspect-ratio: 4 / 5; background: #222; overflow: hidden; }
.foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-codigo); font-size: 12px; color: var(--humo); letter-spacing: .06em; }
.stock { position: absolute; top: 8px; right: 8px; min-width: 38px; height: 38px; padding: 0 8px; display: grid; place-items: center; background: var(--hueso); color: #0d0d0d; font-family: var(--f-codigo); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }
.stock.pocas { background: var(--naranja); }
.stock.cero { background: var(--alerta); color: #fff; }
.stock.nulo { background: #333; color: var(--humo); }
.tag { position: absolute; left: 8px; bottom: 8px; padding: 3px 7px; background: rgba(0,0,0,.75); font-family: var(--f-codigo); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--hueso); }
.card.oculto .foto img { filter: grayscale(1) brightness(.45); }
.nombre { padding: 9px 10px 0; font-weight: 600; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; }
.meta { display: flex; justify-content: space-between; gap: 6px; padding: 4px 10px 10px; font-family: var(--f-codigo); font-size: 11px; color: var(--humo); }
.esq .foto { animation: pulso 1.2s ease-in-out infinite alternate; }
.esq .nombre { height: 34px; }
@keyframes pulso { from { opacity: .5; } to { opacity: 1; } }
.vacio { padding: 48px 16px; text-align: center; color: var(--humo); }

/* ---------- hoja de abajo ---------- */
.velo { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.65); }
.hoja { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; width: 100%; max-width: 560px; margin: 0 auto; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain; background: var(--carbon); border: 1px solid var(--linea); border-bottom: 0; padding: 6px 16px calc(20px + env(safe-area-inset-bottom)); animation: sube .22s ease-out; }
@keyframes sube { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.hoja-top { display: flex; align-items: center; justify-content: center; position: relative; height: 34px; }
.asa { width: 42px; height: 4px; background: #444; }
.cerrar { position: absolute; right: -6px; top: 0; width: 40px; height: 34px; font-size: 18px; color: var(--humo); }
.cabeza { display: grid; grid-template-columns: 84px 1fr auto; gap: 12px; align-items: start; }
.mini { position: relative; aspect-ratio: 4 / 5; background: #222; overflow: hidden; }
.mini img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cabeza h2 { font-family: var(--f-display); font-weight: 400; font-size: 24px; line-height: 1.05; margin: 4px 0 6px; text-transform: uppercase; overflow-wrap: anywhere; }
.cabeza .precio { font-family: var(--f-codigo); font-size: 14px; }
.hay { text-align: right; }
.hay b { display: block; font-family: var(--f-codigo); font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.hay span { display: block; margin-top: 4px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); margin: 16px 0 4px; border: 1px solid var(--linea); }
.tabs button { height: 48px; font-family: var(--f-codigo); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--humo); }
.tabs button + button { border-left: 1px solid var(--linea); }
.tabs button[aria-selected="true"] { background: var(--hueso); color: #0d0d0d; font-weight: 600; }
.etq { display: block; margin: 14px 0 6px; font-family: var(--f-codigo); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--humo); }
.stepper { display: grid; grid-template-columns: 60px 1fr 60px; height: 60px; border: 1px solid var(--linea); }
.stepper button { font-size: 28px; line-height: 1; }
.stepper button:active { background: #262626; }
.stepper input { width: 100%; min-width: 0; text-align: center; font-family: var(--f-codigo); font-size: 28px; font-weight: 600; background: transparent; border: 0; border-left: 1px solid var(--linea); border-right: 1px solid var(--linea); color: var(--blanco); -moz-appearance: textfield; appearance: textfield; }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.opciones { display: flex; flex-wrap: wrap; gap: 8px; }
.opciones button { min-height: 42px; padding: 0 14px; border: 1px solid var(--linea); font-size: 14px; }
.opciones button[aria-pressed="true"] { border-color: var(--hueso); background: var(--hueso); color: #0d0d0d; font-weight: 600; }
.opciones button small { font-family: var(--f-codigo); opacity: .7; margin-left: 6px; }
.campo input { width: 100%; height: 48px; padding: 0 12px; background: var(--asfalto); border: 1px solid var(--linea); color: var(--blanco); font-size: 16px; }
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.resumen { margin: 16px 0 0; font-size: 15px; line-height: 1.45; }
.resumen b { color: var(--hueso); font-family: var(--f-codigo); }
.resumen .aviso { color: var(--naranja); }
.error { margin: 12px 0 0; padding: 10px 12px; background: rgba(217,83,79,.14); border: 1px solid var(--alerta); font-size: 14px; }
.confirmar { width: 100%; height: 58px; margin-top: 14px; background: var(--hueso); color: #0d0d0d; font-family: var(--f-codigo); font-weight: 600; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
.confirmar.compra { background: var(--olivo); }
.confirmar.conteo { background: var(--blanco); }
.confirmar:disabled { opacity: .5; }
.switch { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--linea); font-size: 14px; color: var(--humo); cursor: pointer; }
.switch input { width: 22px; height: 22px; margin: 0; accent-color: var(--olivo); }

/* ---------- nuevo producto ---------- */
.fab { position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 6; height: 54px; padding: 0 20px; background: var(--hueso); color: #0d0d0d; font-family: var(--f-codigo); font-weight: 600; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.fab:active { transform: scale(.96); }
.hoja h2.titulo { font-family: var(--f-display); font-weight: 400; font-size: 26px; text-transform: uppercase; margin: 0 0 12px; }
.lienzo { position: relative; width: 100%; max-width: 340px; margin: 0 auto; aspect-ratio: 4 / 5; background: #222; overflow: hidden; }
.lienzo canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.sin-foto { position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; padding: 20px; text-align: center; }
.sin-foto p { margin: 0 0 4px; color: var(--humo); font-size: 14px; }
.btn { min-height: 46px; padding: 0 16px; border: 1px solid var(--linea); font-family: var(--f-codigo); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
.btn.claro { background: var(--hueso); border-color: var(--hueso); color: #0d0d0d; font-weight: 600; }
.foto-acciones { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
.ayuda { margin: 6px 0 0; text-align: center; font-size: 12px; color: var(--humo); }
.zoom { width: 100%; max-width: 340px; display: block; margin: 8px auto 0; accent-color: var(--hueso); }
.stepper.chico { grid-template-columns: 44px 1fr 44px; height: 48px; }
.stepper.chico input { font-size: 22px; }
.stepper.chico button { font-size: 22px; }
.campo textarea { width: 100%; min-height: 70px; padding: 10px 12px; background: var(--asfalto); border: 1px solid var(--linea); color: var(--blanco); font: inherit; font-size: 16px; border-radius: 0; resize: vertical; }

/* ---------- aviso flotante ---------- */
.toast { position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 20; max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--hueso); color: #0d0d0d; font-size: 14px; font-weight: 500; line-height: 1.35; box-shadow: 0 10px 30px rgba(0,0,0,.55); animation: sube .2s ease-out; }
.toast.mal { background: var(--alerta); color: #fff; }
.toast button { margin-left: auto; flex: none; height: 38px; padding: 0 12px; border: 1px solid currentColor; font-family: var(--f-codigo); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
</style>
</head>
<body>

<header class="top">
  <div class="barra">
    <div>
      <span class="mono muted">INSANITY</span>
      <h1>Inventario</h1>
    </div>
    <div class="hoy" id="hoy">Hoy<b>—</b></div>
    <button class="icono" id="recargar" type="button" aria-label="Actualizar"><span>⟳</span></button>
  </div>
  <div class="filtros">
    <input class="buscar" id="buscar" type="search" placeholder="Buscar nombre o código" autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>
</header>

<main class="grid" id="lista"></main>
<p class="vacio" id="vacio" hidden></p>

<button class="fab" id="nuevo" type="button">+ Nuevo</button>
<input id="fotoCamara" type="file" accept="image/*" capture="environment" hidden>
<input id="fotoGaleria" type="file" accept="image/*" hidden>

<div class="velo" id="velo" hidden></div>
<section class="hoja" id="hoja" hidden role="dialog" aria-modal="true" aria-labelledby="hNombre"></section>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const CLAVE = <?!= JSON.stringify(clave) ?>;

let PRODUCTOS = [], POCAS = 2, filtro = "todos", texto = "", ultimaCarga = 0;
let actual = null;   // producto abierto en la hoja
let f = {};          // lo que se está capturando en la hoja
let toastTimer = 0;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const dinero = n => "$" + Number(n || 0).toLocaleString("es-MX", { maximumFractionDigits: 2 });
const buscarP = c => PRODUCTOS.find(p => p.codigo === c);
const MODOS = { venta: "Vendí", compra: "Compré", conteo: "Contar" };
const PAGOS = ["Efectivo", "Transferencia", "Tarjeta"];
const CANALES = ["Directa", "Mayoreo", "Evento"];

function llamar(fn, ...args) {
  return new Promise((ok, mal) => google.script.run.withSuccessHandler(ok).withFailureHandler(mal)[fn](CLAVE, ...args));
}
const textoError = e => String((e && e.message) || e || "Algo salió mal.").replace(/^Error:\s*/, "");

/* ---------- cargar ---------- */
async function cargar(silencioso) {
  const btn = $("#recargar");
  btn.classList.add("gira");
  if (!silencioso && !PRODUCTOS.length) {
    $("#lista").innerHTML = Array.from({ length: 6 }, () => '<div class="card esq"><div class="foto"></div><div class="nombre"></div></div>').join("");
  }
  try {
    const r = await llamar("panelDatos");
    PRODUCTOS = r.productos;
    POCAS = r.pocas;
    ultimaCarga = Date.now();
    pintarHoy(r.hoy);
    pintarChips();
    pintar();
  } catch (e) {
    $("#lista").innerHTML = "";
    $("#vacio").hidden = false;
    $("#vacio").textContent = "No pude cargar el inventario: " + textoError(e);
  } finally {
    btn.classList.remove("gira");
  }
}

function pintarHoy(h) {
  if (!h) return;
  $("#hoy").innerHTML = `Hoy · ${h.piezas} pz<b>${dinero(h.total)}</b>`;
}

/* ---------- filtros ---------- */
function pintarChips() {
  const cats = [...new Set(PRODUCTOS.map(p => p.categoria))];
  const lista = [["todos", "Todos"], ["pocas", "Por acabarse"], ...cats.map(c => ["cat:" + c, c])];
  if (!lista.some(([k]) => k === filtro)) filtro = "todos";
  $("#chips").innerHTML = lista.map(([k, t]) => `<button class="chip" type="button" data-filtro="${esc(k)}" aria-pressed="${k === filtro}">${esc(t)}</button>`).join("");
}

function visibles() {
  const q = norm(texto.trim());
  return PRODUCTOS.filter(p => {
    if (filtro === "pocas" && !(p.total !== null && p.total <= POCAS)) return false;
    if (filtro.startsWith("cat:") && p.categoria !== filtro.slice(4)) return false;
    return !q || norm(p.nombre + " " + p.codigo + " " + p.categoria).includes(q);
  });
}

/* ---------- tarjetas ---------- */
function fotoHTML(p) {
  const ph = `<span class="ph">${esc(p.codigo.replace(/^INS-/, ""))}</span>`;
  if (!p.fotos || !p.fotos.length) return ph;
  return `${ph}<img src="${esc(p.fotos[0])}" data-fotos="${esc(p.fotos.join("|"))}" data-i="0" alt="" loading="lazy" onerror="sigFoto(this)">`;
}
function sigFoto(img) {
  const lista = img.dataset.fotos.split("|"), i = +img.dataset.i + 1;
  if (i < lista.length) { img.dataset.i = i; img.src = lista[i]; } else img.remove();
}

function claseStock(n) {
  return n === null ? "nulo" : n <= 0 ? "cero" : n <= POCAS ? "pocas" : "";
}

function tarjeta(p) {
  const tag = !p.activo ? "Oculto en web" : p.pedido ? "Sobre pedido" : "";
  return `<button class="card${p.activo ? "" : " oculto"}" type="button" data-c="${esc(p.codigo)}">
    <div class="foto">${fotoHTML(p)}<span class="stock ${claseStock(p.total)}">${p.total === null ? "—" : p.total}</span>${tag ? `<span class="tag">${tag}</span>` : ""}</div>
    <span class="nombre">${esc(p.nombre)}</span>
    <span class="meta"><span>${esc(p.codigo)}</span><span>${dinero(p.precio)}</span></span>
  </button>`;
}

function pintar() {
  const lista = visibles();
  $("#lista").innerHTML = lista.map(tarjeta).join("");
  $("#vacio").hidden = !!lista.length;
  if (!lista.length) $("#vacio").textContent = texto ? `No encontré nada con "${texto}".` : "No hay productos aquí.";
}

function actualizarProducto(p) {
  const i = PRODUCTOS.findIndex(x => x.codigo === p.codigo);
  if (i > -1) PRODUCTOS[i] = p;
  const el = document.querySelector(`.card[data-c="${CSS.escape(p.codigo)}"]`);
  if (el) el.outerHTML = tarjeta(p);
}

/* ---------- hoja: vender / comprar / contar ---------- */
function stockDe(p, talla) {
  if (!p.tallas) return p.stock;
  const t = p.tallas.find(x => x[0] === talla);
  return t ? t[1] : 0;
}

function abrir(codigo) {
  const p = buscarP(codigo);
  if (!p) return;
  actual = p;
  f = { modo: "venta", talla: "", cant: 1, precio: p.precio, pago: "Efectivo", canal: "Directa", nota: "", otra: false };
  elegirTallaInicial();
  $("#velo").hidden = false;
  $("#hoja").hidden = false;
  document.body.style.overflow = "hidden";
  pintarHoja();
}

function elegirTallaInicial() {
  const p = actual;
  if (!p.tallas) { f.talla = ""; return; }
  const conStock = p.tallas.find(t => t[1] > 0);
  f.talla = (f.modo === "venta" && conStock ? conStock : p.tallas[0] || [""])[0];
}

function cerrar() {
  actual = null;
  nuevoAbierto = false;
  $("#nuevo").hidden = false;
  $("#velo").hidden = true;
  $("#hoja").hidden = true;
  document.body.style.overflow = "";
}

function pintarHoja() {
  const p = actual;
  const hay = p.total === null ? "—" : p.total;
  const tallas = p.tallas ? `
    <span class="etq">Talla</span>
    <div class="opciones">
      ${p.tallas.map(([t, n]) => `<button type="button" data-talla="${esc(t)}" aria-pressed="${!f.otra && f.talla === t}">${esc(t)}<small>${n}</small></button>`).join("")}
      ${f.modo !== "venta" ? `<button type="button" data-talla-otra aria-pressed="${f.otra}">+ Otra</button>` : ""}
    </div>
    ${f.otra ? `<label class="campo"><span class="etq">Nueva talla</span><input id="tallaNueva" type="text" value="${esc(f.talla)}" placeholder="Ej. XL" autocomplete="off"></label>` : ""}` : "";

  const venta = f.modo !== "venta" ? "" : `
    <div class="dos">
      <label class="campo"><span class="etq">Precio c/u</span><input id="precio" type="number" inputmode="decimal" min="0" step="any" value="${esc(f.precio)}"></label>
      <label class="campo"><span class="etq">Nota</span><input id="nota" type="text" value="${esc(f.nota)}" placeholder="Opcional" autocomplete="off"></label>
    </div>
    <span class="etq">Pago</span>
    <div class="opciones">${PAGOS.map(x => `<button type="button" data-pago="${x}" aria-pressed="${f.pago === x}">${x}</button>`).join("")}</div>
    <span class="etq">Canal</span>
    <div class="opciones">${CANALES.map(x => `<button type="button" data-canal="${x}" aria-pressed="${f.canal === x}">${x}</button>`).join("")}</div>`;

  $("#hoja").innerHTML = `
    <div class="hoja-top"><span class="asa"></span><button class="cerrar" type="button" data-cerrar aria-label="Cerrar">✕</button></div>
    <div class="cabeza">
      <div class="mini">${fotoHTML(p)}</div>
      <div>
        <span class="mono muted">${esc(p.codigo)} · ${esc(p.categoria)}</span>
        <h2 id="hNombre">${esc(p.nombre)}</h2>
        <span class="precio">${dinero(p.precio)}</span>
      </div>
      <div class="hay"><b>${hay}</b><span class="mono muted">${p.tallas ? "en total" : "en stock"}</span></div>
    </div>
    <div class="tabs" role="tablist">

    <div class="stepper">
      <button type="button" data-paso="-1" aria-label="Menos">−</button>
      <input id="cant" type="number" inputmode="numeric" min="0" value="${f.cant}" aria-label="Cantidad">
      <button type="button" data-paso="1" aria-label="Más">+</button>
    </div>
    ${venta}
    <p class="resumen" id="resumen"></p>
    <p class="error" id="error" hidden></p>
    <button class="confirmar ${f.modo}" id="confirmar" type="button"></button>
    <label class="switch"><input type="checkbox" id="visible" ${p.activo ? "checked" : ""}> Visible en la tienda web</label>`;
  pintarResumen();
}

function pintarResumen() {
  const p = actual, cant = Math.max(0, parseInt(f.cant, 10) || 0);
  const antes = stockDe(p, f.talla), base = antes === null ? 0 : antes;
  const conTalla = p.tallas && f.talla ? ` en talla ${esc(f.talla)}` : "";
  let txt = "", boton = "", valido = f.modo === "conteo" ? cant >= 0 : cant > 0;
  if (p.tallas && !f.talla) valido = false;

  if (f.modo === "venta") {
    const precio = Number(f.precio) || 0;
    let queda;
    if (antes === null) queda = `<span class="aviso">No tiene stock capturado: no se resta nada.</span>`;
    else if (base >= cant) queda = `Quedarán <b>${base - cant}</b>${conTalla}.`;
    else if (base === 0 && p.pedido) queda = `<span class="aviso">Sobre pedido: se registra la venta sin restar stock.</span>`;
    else { queda = `<span class="aviso">Solo hay ${base}${conTalla}.</span>`; valido = false; }
    txt = `Total <b>${dinero(precio * cant)}</b> · ${queda}`;
    boton = `Registrar venta · ${cant}`;
  } else if (f.modo === "compra") {
    txt = `Ahora hay <b>${antes === null ? 0 : antes}</b>${conTalla} → quedarán <b>${base + cant}</b>.`;
    boton = `Agregar ${cant} al stock`;
  } else {
    txt = `Antes: <b>${antes === null ? "vacío" : antes}</b>${conTalla} → ahora: <b>${cant}</b>.`;
    boton = `Guardar: ${cant} en total`;
  }
  $("#resumen").innerHTML = txt;
  const btn = $("#confirmar");
  btn.textContent = boton;
  btn.disabled = !valido;
}

function mostrarError(msg) {
  const el = $("#error");
  if (!el) return toast(msg, null, true);
  el.textContent = msg;
  el.hidden = !msg;
}

async function confirmar() {
  const btn = $("#confirmar");
  const m = { codigo: actual.codigo, talla: f.talla, tipo: f.modo, cant: parseInt(f.cant, 10) || 0,
              precio: f.precio, pago: f.pago, canal: f.canal, nota: f.nota };
  btn.disabled = true;
  btn.textContent = "Guardando…";
  mostrarError("");
  try {
    const r = await llamar("panelMover", m);
    actualizarProducto(r.producto);
    pintarHoy(r.hoy);
    cerrar();
    toast(r.mensaje, r.deshacer);
  } catch (e) {
    mostrarError(textoError(e));
    pintarResumen();
  }
}

async function cambiarVisible(visible) {
  const codigo = actual.codigo;
  try {
    const r = await llamar("panelVisible", codigo, visible);
    actualizarProducto(r.producto);
    if (actual && actual.codigo === codigo) actual = r.producto;
    toast(r.mensaje);
  } catch (e) {
    mostrarError(textoError(e));
    const chk = $("#visible"); if (chk) chk.checked = !visible;
  }
}

/* ---------- aviso con deshacer ---------- */
function toast(msg, deshacer, mal) {
  const t = $("#toast");
  clearTimeout(toastTimer);
  t.className = "toast" + (mal ? " mal" : "");
  t.innerHTML = `<span>${esc(msg)}</span>${deshacer ? '<button type="button" id="deshacer">Deshacer</button>' : ""}`;
  t.hidden = false;
  toastTimer = setTimeout(() => { t.hidden = true; }, deshacer ? 10000 : 4500);
  if (!deshacer) return;
  $("#deshacer").onclick = async () => {
    const b = $("#deshacer");
    b.disabled = true; b.textContent = "…";
    clearTimeout(toastTimer);
    try {
      const r = await llamar("panelDeshacer", deshacer);
      actualizarProducto(r.producto);
      pintarHoy(r.hoy);
      toast(r.mensaje);
    } catch (e) {
      toast(textoError(e), null, true);
    }
  };
}

function dibujarLogo(x, color, cx, cy, ancho) {
  const k = ancho / LOGO.ancho;
  x.save();
  x.translate(cx - ancho / 2, cy - LOGO.alto * k / 2);
  x.scale(k, k);
  x.fillStyle = color;
  LOGO.trazos.forEach(d => x.fill(new Path2D(d)));
  x.restore();
}

function dibujar() {
  const c = $("#lienzo");
  if (!c) return;
  const x = c.getContext("2d"), W = c.width, H = c.height;
  x.fillStyle = "#222";
  x.fillRect(0, 0, W, H);
  if (!N.img) return;
  const iw = N.img.width, ih = N.img.height, girada = N.rot % 180 !== 0;
  const bw = girada ? ih : iw, bh = girada ? iw : ih;
  const s = Math.max(W / bw, H / bh) * N.zoom;
  const mx = Math.max(0, (bw * s - W) / 2), my = Math.max(0, (bh * s - H) / 2);
  N.dx = Math.max(-mx, Math.min(mx, N.dx));
  N.dy = Math.max(-my, Math.min(my, N.dy));
  x.save();
  x.translate(W / 2 + N.dx, H / 2 + N.dy);
  x.rotate(N.rot * Math.PI / 180);
  x.drawImage(N.img, -iw * s / 2, -ih * s / 2, iw * s, ih * s);
  x.restore();
  if (COLOR_MARCA[N.marca]) dibujarLogo(x, COLOR_MARCA[N.marca], W / 2, H * 0.9, W * 0.36);
}

function conectarArrastre() {
  const c = $("#lienzo");
  if (!c || !N.img) return;
  let ini = null;
  c.onpointerdown = e => { ini = { x: e.clientX, y: e.clientY, dx: N.dx, dy: N.dy }; c.setPointerCapture(e.pointerId); };
  c.onpointermove = e => {
    if (!ini) return;
    const k = c.width / c.clientWidth;
    N.dx = ini.dx + (e.clientX - ini.x) * k;
    N.dy = ini.dy + (e.clientY - ini.y) * k;
    dibujar();
  };
  c.onpointerup = c.onpointercancel = () => { ini = null; };
}

// Achica la foto a 2400 px como máximo para que el cel la mueva sin trabarse
function cargarFoto(archivo) {
  if (!archivo) return;
  const url = URL.createObjectURL(archivo);
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas");
    cv.width = Math.round(img.naturalWidth * k);
    cv.height = Math.round(img.naturalHeight * k);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    Object.assign(N, { img: cv, rot: 0, zoom: 1, dx: 0, dy: 0 });
    pintarNuevo();
  };
  img.onerror = () => { URL.revokeObjectURL(url); mostrarError("No pude abrir esa foto. Prueba con otra."); };
  img.src = url;
}

function validarNuevo() {
  const b = $("#guardarNuevo");
  if (!b) return;
  const falta = !N.img ? "Falta la foto" : !N.nombre.trim() ? "Falta el nombre" : !N.categoria.trim() ? "Falta la categoría"
    : !(Number(N.precio) > 0) ? "Falta el precio" : "";
  b.disabled = !!falta;
  b.textContent = falta || "Guardar producto";
}

async function guardarNuevo() {

      nombre: N.nombre, categoria: N.categoria, precio: N.precio, costo: N.costo, stock: parseInt(N.stock, 10) || 0,

function clickNuevo(t) {
  const foto = t.closest("[data-foto]");
  if (foto) { const i = $(foto.dataset.foto === "camara" ? "#fotoCamara" : "#fotoGaleria"); i.value = ""; i.click(); return; }
  if (t.closest("[data-girar]")) { N.rot = (N.rot + 90) % 360; N.dx = N.dy = 0; return dibujar(); }
  const marca = t.closest("[data-marca]");
  if (marca) { N.marca = marca.dataset.marca; document.querySelectorAll("[data-marca]").forEach(b => b.setAttribute("aria-pressed", b === marca)); return dibujar(); }
  const cat = t.closest("[data-cat]");
  if (cat) { N.categoria = cat.dataset.cat; N.otra = false; return pintarNuevo(); }
  if (t.closest("[data-cat-otra]")) { N.otra = true; N.categoria = ""; pintarNuevo(); const i = $("#nCatOtra"); if (i) i.focus(); return; }
  const paso = t.closest("[data-paso-n]");
  if (paso) { N.stock = Math.max(0, (parseInt(N.stock, 10) || 0) + Number(paso.dataset.pasoN)); $("#nStock").value = N.stock; return; }
  if (t.closest("#guardarNuevo")) return guardarNuevo();
}

function inputNuevo(e) {
  const id = e.target.id, v = e.target.value;
  if (id === "zoom") { N.zoom = Number(v) / 100; return dibujar(); }
  const campos = { nNombre: "nombre", nCatOtra: "categoria", nPrecio: "precio", nCosto: "costo", nStock: "stock", nTalla: "talla", nDesc: "descripcion" };
  if (campos[id]) { N[campos[id]] = v; validarNuevo(); }
}

/* ---------- eventos ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  const card = t.closest(".card[data-c]");
  if (card) return abrir(card.dataset.c);

  const chip = t.closest("[data-filtro]");
  if (chip) { filtro = chip.dataset.filtro; pintarChips(); pintar(); window.scrollTo(0, 0); return; }

  if (t.closest("#recargar")) return cargar(true);
  if (t.closest("#velo") || t.closest("[data-cerrar]")) return cerrar();
  if (t.closest("#nuevo")) return abrirNuevo();
  if (nuevoAbierto) return clickNuevo(t);
  if (!actual) return;

  const modo = t.closest("[data-modo]");
  if (modo) {
    f.modo = modo.dataset.modo;
    if (f.otra && f.modo === "venta") f.otra = false;
    if (f.modo === "venta" || !f.talla) elegirTallaInicial();
    const s = stockDe(actual, f.talla);
    f.cant = f.modo === "conteo" ? (s === null ? 0 : s) : 1;
    mostrarError("");
    return pintarHoja();
  }
  const talla = t.closest("[data-talla]");
  if (talla) {
    f.talla = talla.dataset.talla; f.otra = false;
    if (f.modo === "conteo") f.cant = stockDe(actual, f.talla) || 0;
    return pintarHoja();
  }
  if (t.closest("[data-talla-otra]")) { f.otra = true; f.talla = ""; pintarHoja(); const i = $("#tallaNueva"); if (i) i.focus(); return; }

  const paso = t.closest("[data-paso]");
  if (paso) {
    f.cant = Math.max(0, (parseInt(f.cant, 10) || 0) + Number(paso.dataset.paso));
    $("#cant").value = f.cant;
    return pintarResumen();
  }
  const pago = t.closest("[data-pago]");
  if (pago) { f.pago = pago.dataset.pago; document.querySelectorAll("[data-pago]").forEach(b => b.setAttribute("aria-pressed", b === pago)); return; }
  const canal = t.closest("[data-canal]");
  if (canal) { f.canal = canal.dataset.canal; document.querySelectorAll("[data-canal]").forEach(b => b.setAttribute("aria-pressed", b === canal)); return; }

  if (t.closest("#confirmar")) return confirmar();
});

document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "buscar") { texto = e.target.value; return pintar(); }
  if (nuevoAbierto) return inputNuevo(e);
  if (!actual) return;
  if (id === "cant") { f.cant = e.target.value; pintarResumen(); }
  else if (id === "precio") { f.precio = e.target.value; pintarResumen(); }
  else if (id === "nota") { f.nota = e.target.value; }
  else if (id === "tallaNueva") { f.talla = e.target.value.trim().toUpperCase(); pintarResumen(); }
});

document.addEventListener("change", e => {
  const id = e.target.id;
  if (id === "visible" && actual) cambiarVisible(e.target.checked);
  if ((id === "fotoCamara" || id === "fotoGaleria") && nuevoAbierto) cargarFoto(e.target.files[0]);
  if (id === "nActivo" && nuevoAbierto) N.activo = e.target.checked;
});

document.addEventListener("focusin", e => {
  if (e.target.id === "cant" || e.target.id === "precio") e.target.select();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && (actual || nuevoAbierto)) cerrar();
  if (e.key === "Enter" && actual && (e.target.id === "cant" || e.target.id === "precio")) {
    const b = $("#confirmar"); if (b && !b.disabled) confirmar();
  }
});

// Al volver a la app después de un rato, trae los datos nuevos
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !actual && !nuevoAbierto && Date.now() - ultimaCarga > 60000) cargar(true);
});

cargar();
</script>
</body>
</html>
